<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>(Alpha 1) Coursera AutoComplete Extension</title>

    <link rel="stylesheet" href="css/popup.css" />
  </head>

  <body>
    <h3>Coursera AutoComplete Extension</h3>

    <div class="section">
      <label>
        <span class="label-text">Videos</span>
        <input type="checkbox" id="lecture" checked />
      </label>

      <label>
        <span class="label-text">Readings</span>
        <input type="checkbox" id="supplement" checked />
      </label>

      <label>
        <span class="label-text">Programming</span>
        <input type="checkbox" id="gradedProgramming" checked />
      </label>

      <label>
        <span class="label-text">Assignments</span>
        <input type="checkbox" id="staffGraded" checked />
      </label>

      <label>
        <span class="label-text">Quizzes</span>
        <input type="checkbox" id="quiz" checked />
      </label>

      <label>
        <span class="label-text">Exams</span>
        <input type="checkbox" id="exam" checked />
      </label>
    </div>

    <button id="runBtn">Run Automation</button>

    <footer>
      <p>
        Made by
        <a
          href="https://github.com/s1xine"
          target="_blank"
          rel="noopener noreferrer"
        >
          s1xine
        </a>
      </p>
    </footer>

    <script src="scripts/popup.js"></script>
  </body>
</html>
